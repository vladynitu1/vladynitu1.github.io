<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;--surf:#0d0808;--surf2:#160c0c;
    --bord:#3d1414;--bord2:#5c1c1c;
    --acc:#ff1f3d;--acc2:rgba(255,31,61,0.14);
    --grn:#ff6b3d;
    --org:#ff8c42;
    --txt:#f0d8d8;--txtd:#7a5555;--txtm:#c08a8a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Exo 2', sans-serif;
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,31,61,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,31,61,0.03) 1px, transparent 1px);
    background-size:42px 42px;
    pointer-events:none; z-index:0;
  }
  body::after{
    content:''; position:fixed; inset:0;
    background:radial-gradient(ellipse 900px 600px at 50% 40%, rgba(255,31,61,.10), transparent 65%);
    pointer-events:none; z-index:0;
  }

  /* ================= PRELOADER ================= */
  #preloader{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #preloader.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  .ball-stage{
    position:relative; width:170px; height:230px;
    display:flex; align-items:center; justify-content:center;
  }
  .ball{
    width:150px; height:150px; border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 32% 28%, #ff7a8f 0%, #ff1f3d 32%, #7a0f1d 68%, #1a0406 100%);
    box-shadow:
      0 0 40px rgba(255,31,61,.55),
      0 0 90px rgba(255,31,61,.28),
      inset -14px -14px 30px rgba(0,0,0,.55),
      inset 8px 8px 18px rgba(255,255,255,.06);
    animation: bounce 1.3s cubic-bezier(.45,0,.55,1) infinite, spin 2.6s linear infinite;
  }
  .ball::before{
    content:''; position:absolute; top:16%; left:22%;
    width:34%; height:22%; border-radius:50%;
    background:rgba(255,255,255,.35);
    filter:blur(4px);
  }
  .ball-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:900; font-size:28px; letter-spacing:.04em;
    color:#fff; text-shadow:0 0 10px rgba(0,0,0,.6), 0 0 22px rgba(255,31,61,.8);
    animation: counterspin 2.6s linear infinite reverse;
  }
  .ball-shadow{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:96px; height:18px; border-radius:50%;
    background:rgba(0,0,0,.65); filter:blur(7px);
    animation: shadowPulse 1.3s cubic-bezier(.45,0,.55,1) infinite;
  }

  @keyframes bounce{
    0%,100%{ transform:translateY(-38px); }
    50%{ transform:translateY(6px); }
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @keyframes counterspin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(-360deg); }
  }
  @keyframes shadowPulse{
    0%,100%{ width:64px; opacity:.35; }
    50%{ width:100px; opacity:.7; }
  }

  .load-status{
    margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .load-word{
    font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:.35em;
    text-transform:uppercase; color:var(--txtd);
  }
  .load-bar{
    width:180px; height:3px; background:var(--surf2); border:1px solid var(--bord);
    border-radius:2px; overflow:hidden;
  }
  .load-bar-fill{
    height:100%; width:0%; background:linear-gradient(90deg, var(--acc), var(--grn));
    box-shadow:0 0 10px rgba(255,31,61,.6);
    transition:width .1s linear;
  }
  .load-pct{
    font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--acc); letter-spacing:.08em;
  }

  /* ================= MAIN ================= */
  #main{
    position:relative; z-index:1;
    height:100%; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    opacity:0; transform:translateY(14px);
    transition:opacity .8s ease, transform .8s ease;
  }
  #main.show{ opacity:1; transform:translateY(0); }

  .logo{
    display:flex; align-items:baseline; gap:2px; line-height:1; margin-bottom:8px;
  }
  .logo .e{font-family:'Rajdhani',sans-serif; font-size:clamp(52px,12vw,84px); font-weight:900; color:var(--acc); letter-spacing:-2px; text-shadow:0 0 26px rgba(255,31,61,.6);}
  .logo .m{font-family:'Rajdhani',sans-serif; font-size:clamp(52px,12vw,84px); font-weight:900; color:#fff; letter-spacing:-2px; text-shadow:0 0 18px rgba(255,255,255,.35);}
  .logo .x{font-family:'Rajdhani',sans-serif; font-size:clamp(52px,12vw,84px); font-weight:900; color:var(--grn); letter-spacing:-2px; text-shadow:0 0 26px rgba(255,107,61,.6);}
  .logo .dot{color:var(--acc); font-size:22px; margin-left:6px; animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.2;}}

  .tagline{
    font-family:'Share Tech Mono',monospace; font-size:11.5px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--txtd); margin-bottom:44px;
  }

  .actions{
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:520px;
  }
  .action-btn{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:210px; padding:30px 20px;
    background:var(--surf); border:1px solid var(--bord2); border-radius:14px;
    text-decoration:none; color:var(--txt);
    position:relative; overflow:hidden;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .action-btn::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, var(--acc), var(--grn)); opacity:.85;
  }
  .action-btn:hover{ transform:translateY(-4px); border-color:var(--acc); background:var(--surf2); }
  .action-icon{ font-size:30px; filter:drop-shadow(0 0 10px rgba(255,31,61,.5)); }
  .action-title{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; letter-spacing:.03em; text-transform:uppercase;
  }
  .action-sub{
    font-family:'Share Tech Mono',monospace; font-size:10.5px; color:var(--txtd); letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    .ball, .ball-shadow, .ball-label{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="preloader">
  <div class="ball-stage">
    <div class="ball"><div class="ball-label">EMX</div></div>
    <div class="ball-shadow"></div>
  </div>
  <div class="load-status">
    <div class="load-word">se încarcă</div>
    <div class="load-bar"><div class="load-bar-fill" id="loadFill"></div></div>
    <div class="load-pct" id="loadPct">0%</div>
  </div>
</div>

<div id="main">
  <div class="logo">
    <span class="e">E</span><span class="m">M</span><span class="x">X</span><span class="dot">●</span>
  </div>
  <div class="tagline">alege instrumentul</div>

  <div class="actions">
    <a href="fisalucru.html" class="action-btn">
      <span class="action-icon">📋</span>
      <span class="action-title">Fișă de lucru</span>
      <span class="action-sub">program &amp; turnusuri</span>
    </a>
    <a href="salariu.html" class="action-btn">
      <span class="action-icon">💰</span>
      <span class="action-title">Calcul salariu</span>
      <span class="action-sub">fluturaș &amp; ore</span>
    </a>
  </div>
</div>

<script>
(function(){
  var fill = document.getElementById('loadFill');
  var pct = document.getElementById('loadPct');
  var preloader = document.getElementById('preloader');
  var main = document.getElementById('main');

  var p = 0;
  var duration = 1900; // ms
  var start = performance.now();

  function tick(now){
    var elapsed = now - start;
    p = Math.min(100, Math.round((elapsed / duration) * 100));
    fill.style.width = p + '%';
    pct.textContent = p + '%';
    if(elapsed < duration){
      requestAnimationFrame(tick);
    } else {
      finish();
    }
  }

  function finish(){
    preloader.classList.add('hide');
    main.classList.add('show');
  }

  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
