<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;--surf:#0d0808;--surf2:#160c0c;
    --bord:#3d1414;--bord2:#5c1c1c;
    --acc:#ff1f3d;--acc2:rgba(255,31,61,0.14);
    --grn:#ff6b3d;
    --org:#ff8c42;
    --txt:#f0d8d8;--txtd:#7a5555;--txtm:#c08a8a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Exo 2', sans-serif;
    overflow-x:hidden; overflow-y:auto;
    position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,31,61,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,31,61,0.03) 1px, transparent 1px);
    background-size:42px 42px;
    pointer-events:none; z-index:0;
  }
  body::after{
    content:''; position:fixed; inset:0;
    background:radial-gradient(ellipse 900px 600px at 50% 40%, rgba(255,31,61,.10), transparent 65%);
    pointer-events:none; z-index:0;
  }

  /* ================= PRELOADER ================= */
  #preloader{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #preloader.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  .ball-stage{
    position:relative; width:170px; height:230px;
    display:flex; align-items:center; justify-content:center;
  }
  .ball{
    width:150px; height:150px; border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 32% 28%, #ff7a8f 0%, #ff1f3d 32%, #7a0f1d 68%, #1a0406 100%);
    box-shadow:
      0 0 40px rgba(255,31,61,.55),
      0 0 90px rgba(255,31,61,.28),
      inset -14px -14px 30px rgba(0,0,0,.55),
      inset 8px 8px 18px rgba(255,255,255,.06);
    animation: bounce 1.3s cubic-bezier(.45,0,.55,1) infinite, spin 2.6s linear infinite;
  }
  .ball::before{
    content:''; position:absolute; top:16%; left:22%;
    width:34%; height:22%; border-radius:50%;
    background:rgba(255,255,255,.35);
    filter:blur(4px);
  }
  .ball-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:900; font-size:28px; letter-spacing:.04em;
    color:#fff; text-shadow:0 0 10px rgba(0,0,0,.6), 0 0 22px rgba(255,31,61,.8);
    animation: counterspin 2.6s linear infinite reverse;
  }
  .ball-shadow{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:96px; height:18px; border-radius:50%;
    background:rgba(0,0,0,.65); filter:blur(7px);
    animation: shadowPulse 1.3s cubic-bezier(.45,0,.55,1) infinite;
  }

  @keyframes bounce{
    0%,100%{ transform:translateY(-38px); }
    50%{ transform:translateY(6px); }
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @keyframes counterspin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(-360deg); }
  }
  @keyframes shadowPulse{
    0%,100%{ width:64px; opacity:.35; }
    50%{ width:100px; opacity:.7; }
  }

  .load-status{
    margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .load-word{
    font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:.35em;
    text-transform:uppercase; color:var(--txtd);
  }
  .load-bar{
    width:180px; height:3px; background:var(--surf2); border:1px solid var(--bord);
    border-radius:2px; overflow:hidden;
  }
  .load-bar-fill{
    height:100%; width:0%; background:linear-gradient(90deg, var(--acc), var(--grn));
    box-shadow:0 0 10px rgba(255,31,61,.6);
    transition:width .1s linear;
  }
  .load-pct{
    font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--acc); letter-spacing:.08em;
  }

  /* ================= MAIN ================= */
  #main{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 24px 60px; text-align:center;
    opacity:0; transform:translateY(14px);
    transition:opacity .8s ease, transform .8s ease;
  }
  #main.show{ opacity:1; transform:translateY(0); }

  .logo{
    display:flex; align-items:baseline; gap:2px; line-height:1; margin-bottom:8px;
  }
  .logo .e{font-family:'Rajdhani',sans-serif; font-size:clamp(52px,12vw,84px); font-weight:900; color:var(--acc); letter-spacing:-2px; text-shadow:0 0 26px rgba(255,31,61,.6);}
  .logo .m{font-family:'Rajdhani',sans-serif; font-size:clamp(52px,12vw,84px); font-weight:900; color:#fff; letter-spacing:-2px; text-shadow:0 0 18px rgba(255,255,255,.35);}
  .logo .x{font-family:'Rajdhani',sans-serif; font-size:clamp(52px,12vw,84px); font-weight:900; color:var(--grn); letter-spacing:-2px; text-shadow:0 0 26px rgba(255,107,61,.6);}
  .logo .dot{color:var(--acc); font-size:22px; margin-left:6px; animation:blink 1.6s infinite;}
  .logo .dot.status-connected{ color:#2ed573; text-shadow:0 0 14px rgba(46,213,115,.9); }
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.2;}}

  .tagline{
    font-family:'Share Tech Mono',monospace; font-size:11.5px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--txtd); margin-bottom:26px;
  }

  .admin-btn{
    position:fixed; top:18px; right:18px; z-index:50;
    padding:7px 14px; border-radius:20px; font-family:'Share Tech Mono',monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--bord2); background:var(--surf);
    color:var(--txtd); cursor:pointer; transition:border-color .15s, color .15s;
  }
  .admin-btn:hover{ border-color:var(--acc); color:var(--acc); }
  .admin-btn.connected{ color:var(--grn); border-color:rgba(255,107,61,.4); }

  .overlay{
    position:fixed; inset:0; z-index:200; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(5,5,5,.85); backdrop-filter:blur(4px);
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--surf); border:1px solid var(--bord2); border-radius:14px;
    padding:24px; width:100%; max-width:380px; position:relative; text-align:left;
  }
  .modal::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px; border-radius:14px 14px 0 0;
    background:linear-gradient(90deg, var(--acc), var(--grn));
  }
  .modal-title{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--txt); margin-bottom:14px;
  }
  .modal-close{
    position:absolute; top:12px; right:14px; background:none; border:none; color:var(--txtd);
    font-size:18px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ color:var(--acc); }
  .modal-status{
    font-family:'Share Tech Mono',monospace; font-size:11.5px; color:var(--txtd); margin-bottom:12px;
  }
  .modal-status.connected{ color:var(--grn); }
  .gh-form input{
    width:100%; background:var(--surf2); border:1px solid var(--bord2); color:var(--txt);
    padding:9px 10px; border-radius:6px; font-family:'Share Tech Mono',monospace; font-size:12.5px;
    margin-bottom:12px;
  }
  .gh-form input:focus{ outline:none; border-color:var(--acc); box-shadow:0 0 0 3px var(--acc2); }
  .gh-btn{
    padding:9px 14px; border-radius:6px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px;
    letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--bord2); background:var(--surf2);
    color:var(--txtd); cursor:pointer; transition:filter .15s, border-color .15s, color .15s; width:100%;
  }
  .gh-btn.primary{ background:var(--acc); color:#050505; border-color:var(--acc); margin-bottom:8px; }
  .gh-btn:hover{ filter:brightness(1.1); }
  .gh-btn.ghost:hover{ color:var(--acc,#ff2d55); border-color:var(--acc,#ff2d55); }

  .actions{
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:520px;
  }
  .action-btn{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:210px; padding:30px 20px;
    background:var(--surf); border:1px solid var(--bord2); border-radius:14px;
    text-decoration:none; color:var(--txt);
    position:relative; overflow:hidden;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .action-btn::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, var(--acc), var(--grn)); opacity:.85;
  }
  .action-btn:hover{ transform:translateY(-4px); border-color:var(--acc); background:var(--surf2); }
  .action-icon{ font-size:30px; filter:drop-shadow(0 0 10px rgba(255,31,61,.5)); }
  .action-title{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; letter-spacing:.03em; text-transform:uppercase;
  }
  .action-sub{
    font-family:'Share Tech Mono',monospace; font-size:10.5px; color:var(--txtd); letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    .ball, .ball-shadow, .ball-label{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="preloader">
  <div class="ball-stage">
    <div class="ball"><div class="ball-label">EMX</div></div>
    <div class="ball-shadow"></div>
  </div>
  <div class="load-status">
    <div class="load-word">se încarcă</div>
    <div class="load-bar"><div class="load-bar-fill" id="loadFill"></div></div>
    <div class="load-pct" id="loadPct">0%</div>
  </div>
</div>

<div id="main">
  <div class="logo">
    <span class="e">E</span><span class="m">M</span><span class="x">X</span><span class="dot" id="statusDot">●</span>
  </div>
  <div class="tagline">alege instrumentul</div>

  <div class="actions" id="actions">
    <a href="fisalucru.html" class="action-btn">
      <span class="action-icon">📋</span>
      <span class="action-title">Fișă de lucru</span>
      <span class="action-sub">program &amp; turnusuri</span>
    </a>
    <a href="salariu.html" class="action-btn">
      <span class="action-icon">💰</span>
      <span class="action-title">Calcul salariu</span>
      <span class="action-sub">fluturaș &amp; ore</span>
    </a>
    <a href="intarzieri.html" class="action-btn">
      <span class="action-icon">🚆</span>
      <span class="action-title">Întârzieri</span>
      <span class="action-sub">trenuri &amp; sosiri</span>
    </a>
    <a href="fisapontaj.html" class="action-btn">
      <span class="action-icon">📅</span>
      <span class="action-title">Pontaj</span>
      <span class="action-sub">fișă de pontaj</span>
    </a>
    <a href="bani.html" class="action-btn" id="baniBtn" style="display:none;">
      <span class="action-icon">💵</span>
      <span class="action-title">Bani de luat</span>
      <span class="action-sub">registru financiar</span>
    </a>
  </div>
</div>

<button class="admin-btn" id="adminBtn">Admin</button>

<div class="overlay" id="adminOverlay">
  <div class="modal">
    <button class="modal-close" id="adminClose">✕</button>
    <div class="modal-title">⚙ Admin</div>
    <div class="modal-status" id="adminStatus">🔒 Neconectat</div>
    <div class="gh-form" id="adminForm">
      <input type="password" id="ghTokenInput" placeholder="Token GitHub (ghp_...)" autocomplete="off">
      <button class="gh-btn primary" id="ghConnectBtn">Conectează</button>
    </div>
    <button class="gh-btn ghost" id="ghDisconnectBtn" style="display:none;">Deconectează</button>
  </div>
</div>

<script>
  // ── GitHub token gate (same key used across the EMX suite) ──
  var TOKEN_KEY = 'emx_gh_token';
  function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
  function clearToken(){ localStorage.removeItem(TOKEN_KEY); }
  function hasToken(){ return !!getToken(); }

  var adminBtn = document.getElementById('adminBtn');
  var adminOverlay = document.getElementById('adminOverlay');
  var adminStatus = document.getElementById('adminStatus');
  var adminForm = document.getElementById('adminForm');
  var disconnectBtn = document.getElementById('ghDisconnectBtn');

  function refreshAdminUI(){
    adminBtn.classList.toggle('connected', hasToken());
    document.getElementById('statusDot').classList.toggle('status-connected', hasToken());
    if(hasToken()){
      adminStatus.textContent = '🟢 Conectat la GitHub';
      adminStatus.classList.add('connected');
      adminForm.style.display = 'none';
      disconnectBtn.style.display = '';
    } else {
      adminStatus.textContent = '🔒 Neconectat';
      adminStatus.classList.remove('connected');
      adminForm.style.display = '';
      disconnectBtn.style.display = 'none';
    }
    document.getElementById('baniBtn').style.display = hasToken() ? '' : 'none';
  }

  function openAdmin(){
    document.getElementById('ghTokenInput').value = '';
    refreshAdminUI();
    adminOverlay.classList.add('open');
  }
  function closeAdmin(){
    adminOverlay.classList.remove('open');
  }

  async function connectToken(){
    var input = document.getElementById('ghTokenInput');
    var btn = document.getElementById('ghConnectBtn');
    var val = input.value.trim();
    if(!val) return;
    btn.disabled = true; btn.textContent = 'Se verifică...';
    try{
      var res = await fetch('https://api.github.com/repos/vladynitu1/Vlad', {
        headers: { 'Authorization': 'token ' + val, 'Accept': 'application/vnd.github+json' }
      });
      if(!res.ok) throw new Error('Token invalid sau fără acces la repo.');
      setToken(val);
      refreshAdminUI();
    }catch(e){
      alert('Nu am putut conecta: ' + e.message);
    }
    btn.disabled = false; btn.textContent = 'Conectează';
  }

  adminBtn.onclick = openAdmin;
  document.getElementById('adminClose').onclick = closeAdmin;
  adminOverlay.addEventListener('click', function(e){ if(e.target === adminOverlay) closeAdmin(); });
  document.getElementById('ghConnectBtn').onclick = connectToken;
  document.getElementById('ghTokenInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') connectToken();
  });
  disconnectBtn.onclick = function(){
    clearToken();
    refreshAdminUI();
  };

  refreshAdminUI();
</script>

<script>
(function(){
  var fill = document.getElementById('loadFill');
  var pct = document.getElementById('loadPct');
  var preloader = document.getElementById('preloader');
  var main = document.getElementById('main');

  var p = 0;
  var duration = 1900; // ms
  var start = performance.now();

  function tick(now){
    var elapsed = now - start;
    p = Math.min(100, Math.round((elapsed / duration) * 100));
    fill.style.width = p + '%';
    pct.textContent = p + '%';
    if(elapsed < duration){
      requestAnimationFrame(tick);
    } else {
      finish();
    }
  }

  function finish(){
    preloader.classList.add('hide');
    main.classList.add('show');
  }

  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
