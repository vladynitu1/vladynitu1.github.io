<style>
  :root{
    --bg:#050505;--surf:#0d0808;--surf2:#160c0c;--surf3:#1f1010;
    --bord:#3d1414;--bord2:#5c1c1c;
    --acc:#ff1f3d;--acc2:rgba(255,31,61,0.14);
    --grn:#ff6b3d;--grn2:rgba(255,107,61,0.10);
    --yel:#ffc940;--yel2:rgba(255,201,64,0.12);
    --red:#ff2d55;--red2:rgba(255,45,85,0.09);
    --org:#ff8c42;--org2:rgba(255,140,66,0.12);
    --txt:#f0d8d8;--txtd:#7a5555;--txtm:#c08a8a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--txt);

  .section-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; color:var(--txtd); text-transform:uppercase; letter-spacing:0.1em; margin:26px 0 10px;}

  .result-card{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--surf); border:1px solid var(--bord); border-left:3px solid var(--grn);
    border-radius:8px; padding:12px 16px; margin-bottom:8px;
  }
  .result-name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:var(--txt);}
  .result-meta{font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--txtd); margin-top:3px;}
  .result-code{font-family:'Share Tech Mono',monospace; color:var(--acc); font-size:13px; font-weight:700;}

  .person-card{

  .person-card .p-role{font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--txtd); margin-top:2px; text-transform:uppercase; letter-spacing:.06em;}

    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--txtd); background:var(--surf2); border:1px solid var(--bord2); border-radius:7px;

<script>
const CATS = {
  conductori: "Șefi Tren / Vânzători Bilete",
  mecanici: "Mecanici"
};
let state = {
  category: 'conductori',
  view: 'list',
  openDocId: null,
  docsMeta: { conductori: [], mecanici: [] },
  query: '',
  dayQuery: '',
  crossDay: '',
  crossCode: '',
  teamName: '',
  teamDay: ''
};

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---- Persistence on GitHub: reading is public (no token needed), writing needs a token ----
const GH_OWNER = 'vladynitu1';
const GH_REPO = 'vladynitu1.github.io';
const GH_BRANCH = 'main';
const DATA_DIR = 'data';
const TOKEN_KEY = 'emx_gh_token';

function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
function hasToken(){ return !!getToken(); }

function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function encodePath(path){ return path.split('/').map(encodeURIComponent).join('/'); }

// Public read: goes through the GitHub API first (reflects the latest commit immediately,
// unlike the raw.githubusercontent.com CDN which can lag a few minutes behind a write).
// Falls back to the CDN copy only if the API call fails (e.g. rate limit) so search stays usable.
async function ghFetchRaw(path){
  const token = getToken();
  const apiUrl = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + encodePath(path) + '?ref=' + GH_BRANCH;
  try{
    const headers = { Accept: 'application/vnd.github.raw' };
    if(token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch(apiUrl, { cache: 'no-store', headers });
    if(res.status === 404) return null;
    if(res.ok){
      const text = await res.text();
      try{ return JSON.parse(text); }catch(e){ return null; }
    }
  }catch(e){ /* fall through to CDN fallback below */ }

  try{
    const cdnUrl = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + path + '?t=' + Date.now();
    const res2 = await fetch(cdnUrl, { cache: 'no-store' });
    if(res2.status === 404) return null;
    if(!res2.ok) return null;
    return await res2.json();
  }catch(e2){
    console.error('ghFetchRaw failed', path, e2);
    return null;
  }
}

async function ghGetSha(path, token){
  const res = await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + encodePath(path) + '?ref=' + GH_BRANCH, {
    headers: token ? { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } : { Accept: 'application/vnd.github+json' }
  });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('Nu am putut verifica fișierul existent pe GitHub (' + res.status + ')');
  const data = await res.json();
  return data.sha;
}

// Write: requires a token with write access to the repo.
async function ghPutFile(path, obj, message){
  const token = getToken();
  if(!token) throw new Error('Lipsește tokenul GitHub — conectează-te din pagina principală.');
  const sha = await ghGetSha(path, token).catch(()=>null);
  const body = { message, content: b64EncodeUnicode(JSON.stringify(obj, null, 2)), branch: GH_BRANCH };
  if(sha) body.sha = sha;
  const res = await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + encodePath(path), {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    throw new Error('Eroare la salvarea pe GitHub (' + res.status + '): ' + errText);
  }
  return await res.json();
}

async function ghDeleteFile(path, message){
  const token = getToken();
  if(!token) throw new Error('Lipsește tokenul GitHub — conectează-te din pagina principală.');
  const sha = await ghGetSha(path, token);
  if(!sha) return null;
  const res = await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + encodePath(path), {
    method: 'DELETE',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha, branch: GH_BRANCH })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    throw new Error('Eroare la ștergerea de pe GitHub (' + res.status + '): ' + errText);
  }
  return await res.json();
}


function uid(){ return 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

async function loadMeta(cat){
  const data = await ghFetchRaw(DATA_DIR + '/' + cat + '/index.json');
  state.docsMeta[cat] = Array.isArray(data) ? data : [];
}
async function saveMeta(cat){
  await ghPutFile(DATA_DIR + '/' + cat + '/index.json', state.docsMeta[cat], 'update index ' + cat);
}
async function loadAllMeta(){
  await loadMeta('conductori');
  await loadMeta('mecanici');
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  const authed = hasToken();
  let html = '';
  if(authed){
    html += '<div class="tab' + (state.category==='conductori' && state.view==='list' || (state.view==='detail'&&state.category==='conductori') ? ' active':'') + '" data-cat="conductori">Șefi Tren / Vânzători Bilete</div>';
    html += '<div class="tab' + (state.category==='mecanici' && (state.view==='list'||state.view==='detail') ? ' active':'') + '" data-cat="mecanici">Mecanici</div>';
  }
  html += '<div class="tab cross' + (state.view==='cross' ? ' active':'') + '" data-cat="cross">Cine e la trenul X?</div>';
  html += '<div class="tab team' + (state.view==='team' ? ' active':'') + '" data-cat="team">Programul unei persoane</div>';
  tabsEl.innerHTML = html;
  setTabHandlers();
  updateGhAccountBtn();
}

function setTabHandlers(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{
      if(t.dataset.cat === 'cross'){
        state.view = 'cross';
        renderTabs();
        render();
        return;
      }
      if(t.dataset.cat === 'team'){
        state.view = 'team';
        renderTabs();
        render();
        return;
      }
      if((t.dataset.cat === 'conductori' || t.dataset.cat === 'mecanici') && !hasToken()){
        return; // guarded: shouldn't be reachable without a token, but double-check
      }
      state.category = t.dataset.cat;
      state.view='list'; state.openDocId=null; state.query=''; state.dayQuery='';
      renderTabs();
      render();
    };
  });
}

// ---- Positioned PDF extraction: keeps x per token so day-columns can be reconstructed ----
async function extractPdfRows(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const allRows = [];
  const ROW_TOLERANCE = 2;
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items
      .map(item => ({ x: item.transform[4], y: item.transform[5], w: item.width || 0, str: item.str.trim() }))
      .filter(i => i.str.length > 0);
    items.sort((a,b) => b.y - a.y || a.x - b.x);
    let clusters = [];
    let current = null;
    items.forEach(it=>{
      if(current && Math.abs(it.y - current.refY) <= ROW_TOLERANCE){
        current.items.push(it);
      } else {
        if(current) clusters.push(current);
        current = { refY: it.y, items: [it] };
      }
    });
    if(current) clusters.push(current);
    clusters.forEach(c=>{
      const sorted = c.items.slice().sort((a,b)=>a.x-b.x);
      allRows.push({ y: c.refY, items: sorted.map(i=>({x:i.x, w:i.w, str:i.str})) });
    });
  }
  return allRows;
}

function rowsToText(rows){
  return rows.map(r => r.items.map(i=>i.str).join(' ')).join('\n');
}

// ---- Split positioned rows into per-employee blocks, with a day->codes map ----
function splitBlocksStructured(rows){
  const blocks = [];
  let current = null;

  function isHeaderRow(items){
    const strs = items.map(i=>i.str);
    return strs.includes('Data') && strs.filter(s=>/^\d{1,2}$/.test(s)).length >= 15;
  }
  function isTimeRow(items){
    const timeLike = items.filter(i=>/^\d{1,2}:\d{2}$/.test(i.str) || /^\d::\d{2}$/.test(i.str)).length;
    return items.length > 0 && (timeLike / items.length) > 0.5;
  }
  function isCoStartRow(items){
    return items.some(i=>i.str === 'inceput') && items.some(i=>i.str === 'luna');
  }

  rows.forEach(row=>{
    if(isHeaderRow(row.items)){
      if(current) blocks.push(current);
      const dayTokens = row.items.filter(i=>/^\d{1,2}$/.test(i.str))
        .map(i=>({ x: i.x, w: i.w, str: i.str, day: parseInt(i.str, 10) }))
        .filter(i=>i.day >= 1 && i.day <= 31);
      current = { headerRow: row, dayTokens, codeRows: [], allRows: [] };
    } else if(current){
      current.allRows.push(row);
      if(!isTimeRow(row.items) && !isCoStartRow(row.items)){
        current.codeRows.push(row);
      }
    }
  });
  if(current) blocks.push(current);

  return blocks.map((b, idx)=>{
    const colX = b.dayTokens.map(t=>t.x + (t.w||0)/2);
    const colDay = b.dayTokens.map(t=>t.day);
    const n = colX.length;
    let gap = n > 1 ? (colX[n-1] - colX[0]) / (n-1) : 20;

    const dayCodes = {};
    for(let d=1; d<=31; d++) dayCodes[d] = [];

    const allText = rowsToText(b.allRows);
    const NON_NAME = new Set(['efect','Serv','Prenume','Nume','Data','ore','Total','crt','Nr','Sc','ASC','Reg','Reg.','Auto','Festive','Mecanic','Sef','tren','bilete','V','CO','L','ITS','SSM','SU','TL','CM','VPP','SMM']);
    function isAllCapsCode(t){
      // Codurile SCURTE din grafic (TL, CO, L, CM, R etc.) sunt scrise doar cu MAJUSCULE și au
      // cel mult 2 litere. Codurile mai lungi, tot cu majuscule (SSM, VPP, ASC, ITS, SMM...), sunt
      // cunoscute și adăugate explicit în NON_NAME mai sus, nu mai sunt „ghicite" după lungime.
      // NU mai tratăm orice token 100% majuscul ca fiind cod, indiferent de lungime, pentru că în
      // unele fișiere (ex. Brasov-Bucuresti, Cluj) și NUMELE angajaților sunt scrise integral cu
      // MAJUSCULE (ex. "RADU", "NELUTA", "CHIFOR", "SUCEAVA", "POPA", "TUDORACHE") — un prag de
      // lungime le desparte corect de coduri, pentru că niciun nume real din aceste fișiere nu are
      // 1-2 litere.
      const letters = t.replace(/[^a-zA-ZăâîșțĂÂÎȘȚ]/g, '');
      return letters.length > 0 && letters.length <= 2 && letters === letters.toUpperCase();
    }
    function isLabelToken(t){
      if(NON_NAME.has(t)) return true;
      if(isAllCapsCode(t)) return true;
      const words = t.split(/\s+/).filter(Boolean);
      return words.length > 0 && words.every(w => NON_NAME.has(w) || isAllCapsCode(w));
    }
    function firstNameToken(tokens){
      for(const t of tokens){
        if(/\d/.test(t)) continue;
        if(isLabelToken(t)) continue;
        if(t.length < 2) continue;
        return t;
      }
      return '';
    }
    let surname = '', firstname = '';
    for(let i=0;i<b.allRows.length;i++){
      const tokens = b.allRows[i].items.map(it=>it.str);
      if(tokens.includes('Festive')){
        let sIdx = -1;
        for(let k=0;k<tokens.length;k++){
          const t = tokens[k];
          if(/^\d+([:./]\d+)?$/.test(t) || isLabelToken(t)) continue;
          sIdx = k; break;
        }
        surname = sIdx >= 0 ? tokens[sIdx] : '';

        const candidateRows = [];
        candidateRows.push(sIdx >= 0 ? tokens.slice(sIdx+1) : tokens);
        if(b.allRows[i+1]) candidateRows.push(b.allRows[i+1].items.map(it=>it.str));
        if(b.allRows[i+2]) candidateRows.push(b.allRows[i+2].items.map(it=>it.str));

        for(const rowTokens of candidateRows){
          const isRoleRow = rowTokens.includes('Sef') || rowTokens.includes('Mecanic') ||
            (rowTokens.includes('V') && rowTokens.some(t => t.indexOf('bilete') === 0));
          if(isRoleRow) break;
          const f = firstNameToken(rowTokens);
          if(f){ firstname = f; break; }
        }
        break;
      }
    }
    const name = (surname || firstname) ? (surname + ' ' + firstname).trim() : ('Bloc ' + (idx+1) + ' (nume neidentificat)');

    let role = 'Necunoscut';
    if(/Sef\s*tren/i.test(allText)) role = 'Șef tren';
    else if(/V\s*bilete\s*II/i.test(allText)) role = 'Vânzător bilete II';
    else if(/V\s*bilete\s*I\b/i.test(allText)) role = 'Vânzător bilete I';
    else if(/Mecanic/i.test(allText)) role = 'Mecanic';

    const excludeTokens = new Set([surname, firstname, 'Festive'].filter(Boolean));

    if(n > 1){
      const maxGapAllowed = gap * 0.75;
      b.codeRows.forEach(row=>{
        row.items.forEach(item=>{
          if(excludeTokens.has(item.str)) return;
          const x = item.x + (item.w||0)/2;
          let bestDay = -1, bestDist = Infinity;
          for(let k=0;k<n;k++){
            const dist = Math.abs(x - colX[k]);
            if(dist < bestDist){ bestDist = dist; bestDay = colDay[k]; }
          }
          if(bestDay === -1 || bestDist > maxGapAllowed) return;
          dayCodes[bestDay].push(item.str);
        });
      });
    }

    return { id: idx, name, role, dayCodes, text: allText };
  }).filter(b => b.text.trim().length > 0);
}

async function handleUpload(cat, file, month){
  const statusEl = document.getElementById('upload-status');
  if(!hasToken()){ statusEl.textContent = 'Ai nevoie de un token GitHub pentru a încărca fișiere.'; return; }
  if(!file){ statusEl.textContent = 'Alege un fișier PDF.'; return; }
  statusEl.textContent = 'Se extrage textul din PDF...';
  try{
    const rows = await extractPdfRows(file);
    const id = uid();
    statusEl.textContent = 'Se urcă pe GitHub...';
    await ghPutFile(DATA_DIR + '/' + cat + '/' + id + '.json', { rows }, 'add doc ' + file.name);
    const meta = { id, filename: file.name, month: month || '', uploadedAt: new Date().toISOString() };
    state.docsMeta[cat].unshift(meta);
    await saveMeta(cat);
    statusEl.textContent = 'Salvat pe GitHub: ' + file.name;
    render();
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Eroare: ' + e.message;
  }
}

async function deleteDoc(cat, id){
  if(!hasToken()){ alert('Ai nevoie de un token GitHub pentru a șterge fișiere.'); return; }
  if(!confirm('Ștergi definitiv acest program?')) return;
  const statusEl = document.getElementById('upload-status');
  if(statusEl) statusEl.textContent = 'Se șterge de pe GitHub...';
  try{
    await ghDeleteFile(DATA_DIR + '/' + cat + '/' + id + '.json', 'delete doc ' + id);
    state.docsMeta[cat] = state.docsMeta[cat].filter(d=>d.id!==id);
    await saveMeta(cat);
    delete _blocksCache[cat + ':' + id];
    if(state.openDocId===id){ state.view='list'; state.openDocId=null; }
    if(statusEl) statusEl.textContent = 'Șters.';
    render();
  }catch(e){
    console.error(e);
    alert('Eroare la ștergere: ' + e.message);
    if(statusEl) statusEl.textContent = 'Eroare la ștergere.';
  }
}

function normalize(s){
  return (s||'').toLowerCase()
    .replace(/[ăâ]/g,'a').replace(/î/g,'i').replace(/ș/g,'s').replace(/ț/g,'t');
}

function trainCodesForDay(block, day){
  return (block.dayCodes[day] || []).filter(tok => /\d/.test(tok));
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function highlight(text, query){
  if(!query) return escapeHtml(text);
  const esc = escapeHtml(text);
  const safeQ = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc.replace(new RegExp('('+safeQ+')','gi'), '<mark>$1</mark>');
}

const _blocksCache = {};
async function getBlocksForDoc(cat, id){
  const cacheKey = cat + ':' + id;
  if(_blocksCache[cacheKey]) return _blocksCache[cacheKey];
  const data = await ghFetchRaw(DATA_DIR + '/' + cat + '/' + id + '.json');
  const rows = data && Array.isArray(data.rows) ? data.rows : [];
  if(!rows.length) return [];
  const blocks = splitBlocksStructured(rows);
  _blocksCache[cacheKey] = blocks;
  return blocks;
}

function renderBlocks(blocks){
  const holder = document.getElementById('blocks-container');
  const q = state.query.trim();
  const day = parseInt(state.dayQuery.trim(), 10);
  const hasDay = !isNaN(day) && day >= 1 && day <= 31;

  let list = blocks;
  let dayHitMap = {};

  if(hasDay && q){
    list = blocks.filter(b => (b.dayCodes[day]||[]).some(c => c.toLowerCase() === q.toLowerCase() || c.toLowerCase().includes(q.toLowerCase())));
    list.forEach(b=>{ dayHitMap[b.id] = (b.dayCodes[day]||[]).join(', '); });
  } else if(q){
    list = blocks.filter(b => b.text.toLowerCase().includes(q.toLowerCase()) || b.name.toLowerCase().includes(q.toLowerCase()));
  } else if(hasDay){
    list = blocks.filter(b => (b.dayCodes[day]||[]).length > 0);
    list.forEach(b=>{ dayHitMap[b.id] = (b.dayCodes[day]||[]).join(', '); });
  }

  if(list.length === 0){
    holder.innerHTML = '<div class="empty">Niciun rezultat.</div>';
    return;
  }

  holder.innerHTML = '<div class="section-title">' + list.length + ' rezultat(e)</div>' +
    list.map((b, i) => {
      const dayHit = dayHitMap[b.id] ? '<div class="day-hit">Ziua ' + day + ': ' + escapeHtml(dayHitMap[b.id]) + '</div>' : '';
      return '<div class="block ' + (q||hasDay ? 'match':'') + '">' +
        '<div class="block-head"><div><div class="block-name">' + escapeHtml(b.name) + '</div><div class="block-role">' + escapeHtml(b.role) + '</div></div><div class="block-idx">#' + (i+1) + '</div></div>' +
        '<div class="block-body">' + dayHit + '<div class="raw-text">' + highlight(b.text, q) + '</div></div>' +
      '</div>';
    }).join('');
}

async function runCrossSearch(){
  const holder = document.getElementById('cross-results');
  const day = parseInt(state.crossDay, 10);
  const code = state.crossCode.toLowerCase();
  if(isNaN(day) || day < 1 || day > 31 || !code){
    holder.innerHTML = '<div class="empty">Completează ziua (1-31) și codul.</div>';
    return;
  }
  holder.innerHTML = '<div class="empty">Se caută în toate fișierele...</div>';

  const results = [];
  for(const cat of Object.keys(CATS)){
    const docs = state.docsMeta[cat] || [];
    for(const d of docs){
      const blocks = await getBlocksForDoc(cat, d.id);
      blocks.forEach(b=>{
        const codes = b.dayCodes[day] || [];
        const hit = codes.find(c => c.toLowerCase() === code || c.toLowerCase().includes(code));
        if(hit){
          results.push({ name: b.name, role: b.role, category: CATS[cat], file: d.filename, code: hit });
        }
      });
    }
  }

  if(results.length === 0){
    holder.innerHTML = '<div class="empty">Niciun angajat găsit cu codul „' + escapeHtml(state.crossCode) + '” în ziua ' + day + '.</div>';
    return;
  }

  holder.innerHTML = '<div class="section-title">' + results.length + ' găsit(e) — ziua ' + day + ', cod ' + escapeHtml(state.crossCode) + '</div>' +
    results.map(r =>
      '<div class="result-card">' +
        '<div><div class="result-name">' + escapeHtml(r.name) + '</div>' +
        '<div class="result-meta">' + escapeHtml(r.role) + ' · ' + escapeHtml(r.category) + ' · ' + escapeHtml(r.file) + '</div></div>' +
        '<div class="result-code">' + escapeHtml(r.code) + '</div>' +
      '</div>'
    ).join('');
}

async function getAllTaggedBlocks(){
  const out = [];
  for(const cat of Object.keys(CATS)){
    const docs = state.docsMeta[cat] || [];
    for(const d of docs){
      const blocks = await getBlocksForDoc(cat, d.id);
      blocks.forEach(b => out.push({ block: b, cat, doc: d }));
    }
  }
  return out;
}

async function runTeamSearch(){
  const holder = document.getElementById('team-results');
  const nameQ = normalize(state.teamName);
  const dayStr = state.teamDay.trim();
  const hasDay = dayStr !== '';
  const day = parseInt(dayStr, 10);
  if(!nameQ || (hasDay && (isNaN(day) || day < 1 || day > 31))){
    holder.innerHTML = '<div class="empty">Completează numele (ziua e opțională, 1-31).</div>';
    return;
  }
  holder.innerHTML = '<div class="empty">Se caută...</div>';

  const all = await getAllTaggedBlocks();
  const matches = all.filter(t => normalize(t.block.name).includes(nameQ));

  if(matches.length === 0){
    holder.innerHTML = '<div class="empty">Niciun angajat găsit cu numele „' + escapeHtml(state.teamName) + '”.</div>';
    return;
  }

  function crewFor(m, d, code){
    const seen = new Set();
    const crew = all.filter(o => o !== m && o.block.role !== m.block.role && (o.block.dayCodes[d]||[]).includes(code))
      .map(o => ({ name:o.block.name, role:o.block.role }))
      .filter(c=>{
        const key = c.name + '|' + c.role;
        if(seen.has(key)) return false;
        seen.add(key); return true;
      });
    return crew.length
      ? crew.map(c=>'<div class="crew-row"><span class="crew-name">' + escapeHtml(c.name) + '</span><span class="crew-role">' + escapeHtml(c.role) + '</span></div>').join('')
      : '<div class="crew-row"><span class="crew-name">— niciun coleg găsit —</span></div>';
  }

  if(hasDay){
    holder.innerHTML = matches.map(m=>{
      const codes = trainCodesForDay(m.block, day);
      const header = '<div class="p-name">' + escapeHtml(m.block.name) + '</div>' +
        '<div class="p-role">' + escapeHtml(m.block.role) + ' · ' + escapeHtml(CATS[m.cat]) + ' · ' + escapeHtml(m.doc.filename) + '</div>';

      if(codes.length === 0){
        return '<div class="person-card">' + header +
          '<div class="hint" style="margin-top:10px;">Nu are niciun cod de tren în ziua ' + day + ' (liber / CO / altă însemnare).</div></div>';
      }

      const groupsHtml = codes.map(code=>
        '<div class="train-group"><span class="t-code">Tren / cod ' + escapeHtml(code) + '</span>' + crewFor(m, day, code) + '</div>'
      ).join('');

      return '<div class="person-card">' + header + groupsHtml + '</div>';
    }).join('');
  } else {
    holder.innerHTML = matches.map(m=>{
      const header = '<div class="p-name">' + escapeHtml(m.block.name) + '</div>' +
        '<div class="p-role">' + escapeHtml(m.block.role) + ' · ' + escapeHtml(CATS[m.cat]) + ' · ' + escapeHtml(m.doc.filename) + '</div>';

      let dayGroups = '';
      for(let d=1; d<=31; d++){
        const codes = trainCodesForDay(m.block, d);
        if(codes.length === 0) continue;
        const codesHtml = codes.map(code=>
          '<div class="train-group"><span class="t-code">Tren / cod ' + escapeHtml(code) + '</span>' + crewFor(m, d, code) + '</div>'
        ).join('');
        dayGroups += '<div class="section-title" style="margin:16px 0 6px;">Ziua ' + d + '</div>' + codesHtml;
      }

      if(!dayGroups){
        dayGroups = '<div class="hint" style="margin-top:10px;">Niciun cod de tren găsit în această lună.</div>';
      }

      return '<div class="person-card">' + header + dayGroups + '</div>';
    }).join('');
  }
}

async function render(){
  if((state.view==='list' || state.view==='detail') && !hasToken() && (state.category==='conductori' || state.category==='mecanici')){
    state.view = 'cross'; state.openDocId = null;
    renderTabs();
  }
  if(state.view === 'team'){ await renderTeam(); return; }
  if(state.view === 'cross'){ await renderCross(); return; }
  if(state.view==='detail' && state.openDocId){
    const doc = (state.docsMeta[state.category]||[]).find(d=>d.id===state.openDocId);
    if(doc){ await renderDetail(state.category, doc); return; }
    state.view='list';
  }
  renderList();
}

function updateGhAccountBtn(){
  const authed = hasToken();
  const dot = document.getElementById('statusDot');
  if(dot) dot.classList.toggle('status-connected', authed);
  const navBani = document.getElementById('navBani');
  if(navBani && !authed) navBani.remove();
}

// Picks up a token connected/disconnected from index.html in another tab, without needing a manual refresh.
window.addEventListener('storage', function(e){
  if(e.key === TOKEN_KEY){ location.reload(); }
});

(async function init(){
  state.view = hasToken() ? 'list' : 'cross';
  renderTabs();
  await loadAllMeta();
  render();
})();
</script>
</body>
</html>
